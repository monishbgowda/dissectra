<!DOCTYPE html>

<html>
<head>

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    "
  />

  <style>

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #090909;

      touch-action: none;
    }


    canvas {
      display: block;

      width: 100%;
      height: 100%;

      touch-action: none;
    }


    #status {
      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(
          -50%,
          -50%
        );

      color: #ffffff;

      font-family:
        Arial,
        sans-serif;

      font-size: 13px;

      text-align: center;

      pointer-events: none;
    }


    #hint {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 16px;

      color:
        rgba(
          255,
          255,
          255,
          0.55
        );

      font-family:
        Arial,
        sans-serif;

      font-size: 11px;

      text-align: center;

      pointer-events: none;
    }

  </style>

</head>


<body>

  <div id="status">
    Loading 3D model...
  </div>

  <div id="hint">
    Drag to rotate • Pinch to zoom • Tap a component
  </div>


  <script
    src="viewer.bundle.js"
  ></script>


  <script>

    (function () {
      function sendToApp(data) {
  if (
    window.ReactNativeWebView
  ) {
    window.ReactNativeWebView
      .postMessage(
        JSON.stringify(data)
      );
  }
}


sendToApp({
  type: 'debug',
  message:
    'viewer.html JavaScript started',
});


window.onerror =
  function (
    message,
    source,
    line,
    column,
    error
  ) {
    sendToApp({
      type: 'javascriptError',

      message:
        String(message),

      source:
        String(source),

      line,

      column,

      error:
        error
          ? String(error)
          : '',
    });
  };
  if (
  !window.Dissectra3D
) {
  document.getElementById(
    'status'
  ).innerHTML =
    '3D engine failed to load';

  sendToApp({
    type: 'engineError',

    message:
      'window.Dissectra3D is undefined. viewer.bundle.js failed to load.',
  });

  return;
}
      const {
        THREE,
        GLTFLoader,
      } =
        window.Dissectra3D;


      const status =
        document.getElementById(
          'status'
        );


      /* -------------------------
         SCENE
      ------------------------- */

      const scene =
        new THREE.Scene();

      scene.background =
        new THREE.Color(
          0x090909
        );


      /* -------------------------
         CAMERA
      ------------------------- */

      const camera =
        new THREE.PerspectiveCamera(
          45,
          window.innerWidth /
            window.innerHeight,
          0.01,
          1000
        );

      camera.position.set(
        0,
        0,
        5
      );


      /* -------------------------
         RENDERER
      ------------------------- */

      const renderer =
        new THREE.WebGLRenderer({
          antialias: true,
        });

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio,
          2
        )
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.outputColorSpace =
        THREE.SRGBColorSpace;


      document.body.appendChild(
        renderer.domElement
      );


      /* -------------------------
         LIGHTING
      ------------------------- */

      scene.add(
        new THREE.HemisphereLight(
          0xffffff,
          0x333333,
          2.5
        )
      );


      const keyLight =
        new THREE.DirectionalLight(
          0xffffff,
          3
        );

      keyLight.position.set(
        4,
        6,
        5
      );

      scene.add(
        keyLight
      );


      const fillLight =
        new THREE.DirectionalLight(
          0xffffff,
          1.5
        );

      fillLight.position.set(
        -4,
        1,
        3
      );

      scene.add(
        fillLight
      );


      /* -------------------------
         MODEL ROOT
      ------------------------- */

      const modelRoot =
        new THREE.Group();

      scene.add(
        modelRoot
      );


      let loadedModel =
        null;

      const selectableMeshes =
        [];


      /* -------------------------
         LOAD GLB
      ------------------------- */

      const loader =
        new GLTFLoader();


      loader.load(

  'file:///android_asset/demo3d/demo-device.glb',

  function (gltf) {

    // existing success code

  },

  function (progress) {

    if (
      window.ReactNativeWebView
    ) {

      window.ReactNativeWebView
        .postMessage(
          JSON.stringify({
            type:
              'modelProgress',

            loaded:
              progress.loaded || 0,

            total:
              progress.total || 0
          })
        );

    }

  },

  function (error) {

    // error callback above

  }

);

      /* -------------------------
         BASIC ROTATION
      ------------------------- */

      let dragging =
        false;

      let moved =
        false;

      let previousX =
        0;

      let previousY =
        0;


      renderer.domElement
        .addEventListener(
          'pointerdown',

          function (event) {

            dragging =
              true;

            moved =
              false;

            previousX =
              event.clientX;

            previousY =
              event.clientY;

          }
        );


      renderer.domElement
        .addEventListener(
          'pointermove',

          function (event) {

            if (
              !dragging
            ) {

              return;

            }


            const dx =
              event.clientX -
              previousX;

            const dy =
              event.clientY -
              previousY;


            if (
              Math.abs(dx) +
                Math.abs(dy) >
              2
            ) {

              moved =
                true;

            }


            modelRoot.rotation.y +=
              dx *
              0.008;

            modelRoot.rotation.x +=
              dy *
              0.008;


            previousX =
              event.clientX;

            previousY =
              event.clientY;

          }
        );


      renderer.domElement
        .addEventListener(
          'pointerup',

          function () {

            dragging =
              false;

          }
        );


      /* -------------------------
         RENDER LOOP
      ------------------------- */

      function animate() {

        requestAnimationFrame(
          animate
        );

        renderer.render(
          scene,
          camera
        );

      }


      animate();


      /* -------------------------
         RESIZE
      ------------------------- */

      window.addEventListener(
        'resize',

        function () {

          camera.aspect =
            window.innerWidth /
            window.innerHeight;

          camera
            .updateProjectionMatrix();


          renderer.setSize(
            window.innerWidth,
            window.innerHeight
          );

        }
      );

    })();

  </script>

</body>
</html>
